name: Daily news update

on:
  schedule:
    - cron: "0 7 * * *"     # every day at 07:00 UTC
  workflow_dispatch:         # adds a "Run workflow" button to start it by hand

permissions:
  contents: write            # allows the workflow to push the update

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run the agent
        run: python agent.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}

      - name: Commit and push the update
        run: |
          git config user.name "news-agent"
          git config user.email "news-agent@users.noreply.github.com"
          git add published.json docs/index.html
          git diff --cached --quiet || git commit -m "Daily news update"
          git push